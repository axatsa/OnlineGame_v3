<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нет подключения к сети — ClassPlay</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      color: #1f2937;
      text-align: center;
      padding: 20px;
    }
    img {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #6b7280;
      max-width: 400px;
      line-height: 1.5;
    }
    button {
      margin-top: 24px;
      padding: 12px 24px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <img src="/logo_sticker.webp" alt="ClassPlay Logo">
  <h1>Вы находитесь офлайн</h1>
  <p>Для создания новых игр и использования ИИ-генераторов требуется подключение к интернету.</p>
  <button onclick="window.location.reload()">Попробовать снова</button>
</body>
</html>
